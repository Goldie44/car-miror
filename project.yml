# XcodeGen spec: the Xcode project is generated from this file on the CI Mac,
# because Xcode (and .xcodeproj editing) is not available on Windows.
name: CarMiror

options:
  bundleIdPrefix: com.carmiror
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CarMiror:
    type: application
    platform: iOS
    sources:
      - path: CarMiror
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carmiror.app
        GENERATE_INFOPLIST_FILE: YES
        # Holds only what build settings cannot express (lists); merged with the generated keys.
        INFOPLIST_FILE: CarMiror/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Car Miror
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Permission prompt text: iOS reads it from Info.plist, so it lives here rather than in Localizable.xcstrings.
        INFOPLIST_KEY_NSMotionUsageDescription: "Car Miror détecte quand tu roules pour masquer la vidéo pendant la conduite."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"

  CarMirorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CarMirorTests
    dependencies:
      - target: CarMiror
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CarMiror:
    build:
      targets:
        CarMiror: all
        CarMirorTests: [test]
    test:
      targets:
        - CarMirorTests
